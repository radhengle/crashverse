# Signed release AAB for Play (PR #8, folded into integration/v2). Manual dispatch on main only; never publishes.
# Upload key from the protected `release` environment's secrets (never the dev key: BuildScript refuses it); the job is skipped
# cleanly when they are missing. Gates: release profile (non-debuggable, no CRASHVERSE_DEV), targetSdk 35, arm64 libs,
# 16 KB ELF alignment, and the built-output release guard on the AAB itself.
name: Build Android AAB (release, signed)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secrets-check:
    name: Upload-key secrets present?
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          AN: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          AP: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          if [ -n "$KS" ] && [ -n "$KP" ] && [ -n "$AN" ] && [ -n "$AP" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Upload-key secrets not configured; skipping the signed AAB build."
          fi

  aab:
    name: GameCI Unity Android AAB (release, upload key)
    needs: secrets-check
    if: needs.secrets-check.outputs.present == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - name: Free disk space (unityci editor image is large)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
          fetch-depth: 0
          persist-credentials: false
      - name: Release guards (source)
        run: python3 Tools/ci/check_release_guards.py
      - name: Decode upload keystore (workspace-local, gitignored, removed after build)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          mkdir -p build-secrets
          printf '%s' "$KS" | base64 -d > build-secrets/upload.keystore
      - name: Build AAB
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4 (v4.8.2)
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.62f3
          buildName: CRASHVERSE
          buildsPath: build
          buildMethod: Crashverse.EditorTools.BuildScript.BuildAndroid
          customParameters: -crashverseProfile release # GameCI's docker doesn't forward CRASHVERSE_* env
          versioning: Custom
          version: 0.1.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          androidExportType: androidAppBundle
          androidTargetSdkVersion: AndroidApiLevel35
          androidKeystoreName: build-secrets/upload.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
      - name: Remove keystore
        if: always()
        run: sudo rm -rf build-secrets
      - name: Assert AAB (arm64 libs, non-debuggable, targetSdk 35, 16 KB)
        run: |
          set -e
          sudo chown -R "$(id -u):$(id -g)" build
          f=$(ls build/Android/*.aab | head -1)
          unzip -l "$f" | grep -E 'lib/(arm64-v8a|armeabi-v7a)/' | tee native_libs.txt
          for lib in libil2cpp.so libunity.so; do grep -q "base/lib/arm64-v8a/$lib" native_libs.txt || { echo "::error::$f is missing base/lib/arm64-v8a/$lib"; exit 1; }; done
          curl -fsSLo bt.zip https://dl.google.com/android/repository/build-tools_r35_linux.zip
          echo "bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88  bt.zip" | sha256sum -c -
          unzip -q bt.zip -d bt; BT=$PWD/$(ls -d bt/* | head -1)
          curl -fsSLo bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          java -jar bundletool.jar dump manifest --bundle "$f" > aab_manifest.xml
          grep -q 'android:debuggable="true"' aab_manifest.xml && { echo "::error::release AAB is debuggable"; exit 1; }
          grep -qE 'android:targetSdkVersion="35"' aab_manifest.xml || { echo "::error::AAB targetSdkVersion is not 35"; grep -o 'targetSdkVersion="[0-9]*"' aab_manifest.xml; exit 1; }
          rm -rf so && mkdir so && unzip -q "$f" 'base/lib/arm64-v8a/*.so' -d so
          python3 - so <<'PY'
          import os, struct, sys
          bad = []
          for root, _, files in os.walk(sys.argv[1]):
              for f in files:
                  b = open(os.path.join(root, f), 'rb').read()
                  phoff, = struct.unpack_from('<Q', b, 0x20); phentsize, phnum = struct.unpack_from('<HH', b, 0x36)
                  al = [struct.unpack_from('<Q', b, phoff + i * phentsize + 0x30)[0] for i in range(phnum) if struct.unpack_from('<I', b, phoff + i * phentsize)[0] == 1]
                  if al and min(al) < 16384: bad.append(f"{f} align={hex(min(al))}")
          print("16 KB check:", "OK" if not bad else bad)
          if bad and os.environ.get("CV_REQUIRE_16K", "1") == "1": print("::error::native libs not 16 KB aligned"); sys.exit(1)
          PY
      - name: Release guard on built output (the AAB)
        run: python3 Tools/ci/check_release_guards.py --built "$(ls build/Android/*.aab | head -1)"
      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crashverse-android-aab
          path: build/Android/*.aab
          if-no-files-found: error
          retention-days: 14
