# Backend server v0: build + test only. Nothing here deploys, provisions or uses cloud credentials.
name: server-ci
on:
  pull_request:
    paths: ["server/**", "Assets/_Project/Scripts/**", ".github/workflows/server-ci.yml"]
  push:
    branches: [main, "backend/**"]
    paths: ["server/**", "Assets/_Project/Scripts/**", ".github/workflows/server-ci.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build server/Crashverse.Server.sln -c Release
      - name: Test (Firestore emulator tests skip without FIRESTORE_EMULATOR_HOST)
        run: dotnet test server/Crashverse.Server.sln -c Release --no-build

  # QA: proof that the Firestore emulator tests run in CI. Local emulator only: project demo-crashverse (the demo- prefix keeps
  # firebase-tools fully offline from any real project), no credentials, no login, no deploy. Fails if any test is skipped.
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FIREBASE_TOOLS_VERSION: "15.34.0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install firebase-tools (exact version, emulator only)
        run: npm install --global --no-fund --no-audit "firebase-tools@${FIREBASE_TOOLS_VERSION}"
      - name: Build
        run: dotnet build server/Crashverse.Server.sln -c Release
      - name: Test on the Firestore emulator (FIRESTORE_EMULATOR_HOST set by emulators:exec)
        working-directory: server
        run: |
          firebase emulators:exec --only firestore --project demo-crashverse \
            'echo "FIRESTORE_EMULATOR_HOST=$FIRESTORE_EMULATOR_HOST" && test -n "$FIRESTORE_EMULATOR_HOST" && dotnet test Crashverse.Server.sln -c Release --no-build --logger "trx;LogFileName=emulator.trx" --results-directory "$RUNNER_TEMP/trx"'
      - name: Fail if any test was skipped
        run: |
          trx=$(ls "$RUNNER_TEMP"/trx/*.trx)
          counters=$(grep -o '<Counters [^>]*>' "$trx"); echo "$counters"
          total=$(echo "$counters" | sed -E 's/.* total="([0-9]+)".*/\1/')
          passed=$(echo "$counters" | sed -E 's/.* passed="([0-9]+)".*/\1/')
          notrun=$(echo "$counters" | sed -E 's/.* notExecuted="([0-9]+)".*/\1/')
          emu=$(grep -c 'testName="Crashverse.Server.Tests.FirestoreEmulatorTests\.' "$trx" || true)
          echo "total=$total passed=$passed notExecuted=$notrun emulatorTests=$emu"
          if [ "$notrun" != "0" ] || [ "$passed" != "$total" ]; then echo "::error::$notrun skipped / $((total-passed)) not passed"; exit 1; fi
          if grep -q 'outcome="NotExecuted"' "$trx"; then echo "::error::skipped tests present"; exit 1; fi
          if [ "$emu" -lt 7 ]; then echo "::error::expected 7 Firestore emulator tests, found $emu"; exit 1; fi
