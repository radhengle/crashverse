name: Build Android APK

# Security Review v1 §5: actions pinned to commit SHAs, least-privilege permissions, no dirty builds,
# Unity secrets exposed only to the build job and only on main. DEV profile by default; release via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile (dev includes CRASHVERSE_DEV: local backend stub, test clock, QA tools)"
        type: choice
        options: [dev, release]
        default: dev
      publish_tag:
        description: "If set, publish a NEW prerelease after every gate passes: an unused tag (e.g. dev-build-7) or 'next'. main / dev/* only; an existing tag is never overwritten"
        type: string
        default: ""
  push:
    branches: [ main ]   # Security L-52-1: no integration/** trigger with signing secrets
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'Tools/**'
      - 'qa/ci/**'
      - '.github/workflows/android-apk.yml'
  # PR check path: unsigned (Unity debug keystore) build + the same emulator smoke; never signing secrets, never publishes
  pull_request:
    branches: [ main ]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'Tools/**'
      - 'qa/ci/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guards:
    name: Release guards + tests (B1)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PROFILE: ${{ github.event.inputs.profile || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Dev-only symbols must be guarded (fails release if LocalBackendService/test clock/QA tools leak)
        run: python3 Tools/ci/check_release_guards.py

      - name: Release guard self-tests
        run: python3 Tools/ci/test_check_release_guards.py

      - name: Compile check (release defines, no CRASHVERSE_DEV)
        run: dotnet build Tools/CompileCheck

      - name: Compile check (dev defines)
        run: dotnet build Tools/CompileCheck -p:CrashverseDev=true

      - name: Logic tests
        run: dotnet run --project Tools/Tests

      - name: Hint angles derived from target pieces (not hand-edited)
        run: python3 Tools/ContentGen/derive_hints.py --check

  build:
    name: GameCI Unity Android (${{ github.event.inputs.profile || 'dev' }})
    needs: guards
    # M2 + Security L-52-1: SIGNED builds only from a push to main or a dispatch on main / dev/*. Pull requests into main
    # build unsigned (Unity's debug keystore) for the PR check; the dev keystore secrets are never referenced for them.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/dev/'))
    environment: ${{ github.event_name != 'pull_request' && 'dev-signing' || 'unity' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CRASHVERSE_BUILD_PROFILE: ${{ github.event.inputs.profile || 'dev' }}
      CV_SIGN: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev/')) }}
    steps:
      - name: Free disk space (unityci editor image is large)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
          fetch-depth: 0 # full history: GameCI never needs to `git fetch` (credentials are not persisted)
          persist-credentials: false

      - name: Cache Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Library
          key: Library-Android-${{ env.CRASHVERSE_BUILD_PROFILE }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-${{ env.CRASHVERSE_BUILD_PROFILE }}-

      - name: Decode persistent dev keystore (never committed; separate from the Play upload key)
        if: env.CV_SIGN == 'true'
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: |
          set -e
          [ -n "$DEV_KEYSTORE_BASE64" ] || { echo "::error::DEV_KEYSTORE_BASE64 secret missing"; exit 1; }
          mkdir -p build-secrets && umask 077 && echo "$DEV_KEYSTORE_BASE64" | base64 -d > build-secrets/dev.keystore

      - name: Build APK
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4 (v4.8.2)
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          CRASHVERSE_BUILD_PROFILE: ${{ env.CRASHVERSE_BUILD_PROFILE }}
          CRASHVERSE_VERSION_CODE: ${{ github.run_number }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.62f3
          buildName: CRASHVERSE
          buildsPath: build
          buildMethod: Crashverse.EditorTools.BuildScript.BuildAndroid
          versioning: Custom # no git-derived versioning (it ran `git fetch`, which fails without persisted credentials)
          version: 0.1.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          androidTargetSdkVersion: AndroidApiLevel35 # release blocker: target Android 15; GameCI installs platforms;android-35
          # GameCI's docker doesn't forward CRASHVERSE_* env (QA R-3). Security #55 M-1: no keystore or password goes to GameCI/Unity
          # (it would put them on Unity's argv, echoed in the public log); the step below signs on the runner with passwords from env.
          customParameters: -crashverseProfile ${{ env.CRASHVERSE_BUILD_PROFILE }} -crashverseSignAfter

      - name: Assert built APK (arm64 libs, allowBackup=false, portrait-only, release non-debuggable)
        run: bash Tools/ci/check_apk.sh "$(ls build/Android/*.apk | head -1)" "$CRASHVERSE_BUILD_PROFILE"

      - name: Get build-tools 35 (zipalign -P 16, apksigner)
        run: |
          set -e
          curl -fsSLo bt.zip https://dl.google.com/android/repository/build-tools_r35_linux.zip
          echo "bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88  bt.zip" | sha256sum -c - # pinned (Google repo sha1 2cfaa0bb…07bc)
          unzip -q bt.zip -d bt && echo "BT=$PWD/$(ls -d bt/* | head -1)" >> $GITHUB_ENV

      - name: zipalign -P 16 + re-sign v1+v2+v3 with the persistent dev key
        if: env.CV_SIGN == 'true'
        env:
          KS_PASS: ${{ secrets.DEV_KEYSTORE_PASS }}
          KA_NAME: ${{ secrets.DEV_KEYALIAS_NAME }}
          KA_PASS: ${{ secrets.DEV_KEYALIAS_PASS }}
        run: |
          set -e
          sudo chown -R "$(id -u):$(id -g)" build build-secrets # written by the GameCI container as root
          f=$(ls build/Android/*.apk | head -1)
          zip -q -d "$f" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' || true # drop Unity's debug-key v1 signature
          "$BT/zipalign" -f -P 16 -v 4 "$f" aligned.apk > /dev/null
          "$BT/apksigner" sign --ks build-secrets/dev.keystore --ks-pass env:KS_PASS --ks-key-alias "$KA_NAME" --key-pass env:KA_PASS \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$f" aligned.apk
          rm -f aligned.apk "$f.idsig"
          "$BT/zipalign" -c -P 16 -v 4 "$f" | tail -1
          # Phone A/B variant (BUG-22): same build without lib/x86_64 (dev-build-3 had arm only and installs on the user's phone)
          arm="${f%.apk}-arm-only.apk"; cp "$f" stripped.apk
          zip -q -d stripped.apk 'lib/x86_64/*' 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/MANIFEST.MF'
          "$BT/zipalign" -f -P 16 4 stripped.apk aligned.apk
          "$BT/apksigner" sign --ks build-secrets/dev.keystore --ks-pass env:KS_PASS --ks-key-alias "$KA_NAME" --key-pass env:KA_PASS \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$arm" aligned.apk
          rm -f stripped.apk aligned.apk "$arm.idsig"
          "$BT/apksigner" verify -v "$arm" | head -5

      - name: Remove keystore from the workspace
        if: always()
        run: sudo rm -rf build-secrets

      - name: Verify signature, cert pin, versionCode, no testOnly (publish gate)
        if: env.CV_SIGN == 'true'
        env:
          EXPECTED_VC: ${{ github.run_number }}
        run: |
          set -e
          for f in build/Android/*.apk; do
          "$BT/apksigner" verify --print-certs -v --min-sdk-version 23 "$f" | tee sig.txt  # v1 is only reported when checked below API 24
          for v in "v1 scheme (JAR signing)" "v2 scheme (APK Signature Scheme v2)" "v3 scheme (APK Signature Scheme v3)"; do
            grep -qF "Verified using $v: true" sig.txt || { echo "::error::not signed with $v"; exit 1; }
          done
          "$BT/zipalign" -c -P 16 4 "$f" || { echo "::error::not zipaligned (-P 16)"; exit 1; }
          [ "$(grep -c 'Signer #[0-9]* certificate SHA-256 digest' sig.txt)" = 1 ] || { echo "::error::expected exactly one signer"; exit 1; }
          sha=$(grep -m1 "Signer #1 certificate SHA-256 digest" sig.txt | awk '{print $NF}')
          [ "$sha" = "$(tr -d ' \n' < Tools/ci/dev_cert_sha256.txt)" ] || { echo "::error::signing cert $sha != pinned dev cert (Tools/ci/dev_cert_sha256.txt)"; exit 1; }
          "$BT/aapt2" dump badging "$f" | tee badging.txt | head -3
          grep -q "versionCode='$EXPECTED_VC'" badging.txt || { echo "::error::versionCode is not run_number $EXPECTED_VC"; exit 1; }
          if "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$f" | grep -qi testOnly; then echo "::error::testOnly set"; exit 1; fi
          echo "OK $f cert=$sha versionCode=$EXPECTED_VC"
          done

      - name: Release guard on built output (no dev aim hook symbols in IL2CPP metadata)
        if: env.CRASHVERSE_BUILD_PROFILE == 'release'
        run: |
          set -e
          for f in build/Android/*.apk; do python3 Tools/ci/check_release_guards.py --built "$f"; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crashverse-android-apk
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 14

  # Release blocker (v2): the release profile is built and its guards run on every PR into main, not only on a manual dispatch.
  # Unsigned (Unity debug keystore), never published, no signing secrets. Asserts non-debuggable, targetSdk 35, no dev symbols.
  build-release:
    name: GameCI Unity Android (release profile, PR guard)
    needs: guards
    if: github.event_name == 'pull_request'
    environment: unity
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CRASHVERSE_BUILD_PROFILE: release
    steps:
      - name: Free disk space (unityci editor image is large)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
          fetch-depth: 0
          persist-credentials: false
      - name: Cache Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Library
          key: Library-Android-release-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-release-
            Library-Android-dev-
      - name: Build release APK (unsigned)
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4 (v4.8.2)
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          CRASHVERSE_BUILD_PROFILE: release
          CRASHVERSE_VERSION_CODE: ${{ github.run_number }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.62f3
          buildName: CRASHVERSE
          buildsPath: build
          buildMethod: Crashverse.EditorTools.BuildScript.BuildAndroid
          versioning: Custom
          version: 0.1.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          androidTargetSdkVersion: AndroidApiLevel35
          customParameters: -crashverseProfile release -crashverseEmulatorAbi # + x86_64 so the release variant runs on the CI emulator (QA V2-08)
      - name: Assert built release APK (non-debuggable, targetSdk 35, arm64, 16 KB report)
        run: bash Tools/ci/check_apk.sh "$(ls build/Android/*.apk | head -1)" release
      - name: Release guard on built output (no dev symbols in IL2CPP metadata)
        run: |
          set -e
          sudo chown -R "$(id -u):$(id -g)" build
          for f in build/Android/*.apk; do python3 Tools/ci/check_release_guards.py --built "$f"; done
      - name: Upload release APK (PR check artifact, not published)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crashverse-android-apk-release-unsigned
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 7

  emulator-smoke:
    name: Emulator smoke API ${{ matrix.api }} x86_64 1080x2340 #${{ matrix.rep }} (publish gate)
    needs: [build, build-release]
    if: always() && needs.build.result == 'success' # build-release runs on PRs only (skipped otherwise)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36] # 36 = Android 16, the user's Nothing Phone 3a. arm64 images can't boot on x86 runners.
        rep: [1]
        include: # QA V2-01: API 34 three times per run (stability evidence for the age-gate teardown)
          - { api: 34, rep: 2 }
          - { api: 34, rep: 3 }
    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            Tools/ci
            qa/ci
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crashverse-android-apk
          path: apk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.build-release.result == 'success'
        with:
          name: crashverse-android-apk-release-unsigned
          path: rel
      - name: QA first-run flow (age gate → map → L1 → win → retry → fail)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim -skin 1080x2340 # ANGLE on SwiftShader-Vulkan: the GL translator caps vertex uniforms at 256 and URP Simple Lit fails to link (run 40062717341)
          # then (PRs) the release variant: launch it and get past the age gate (QA V2-08)
          script: bash Tools/ci/smoke_infra_retry.sh "$(ls apk/*.apk | grep -v arm-only | head -1)" smoke_out && if [ -d rel ]; then bash Tools/ci/release_launch.sh "$(ls rel/*.apk | head -1)" smoke_out; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: emulator-smoke-api${{ matrix.api }}-${{ matrix.rep }}
          path: smoke_out
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish prerelease (only after signing gate + emulator smoke on every API)
    needs: [build, emulator-smoke]
    # QA C-9b + Security L-52-1: dispatch only, from main or dev/* only, a NEW tag each time (never overwrites), tagged at the
    # exact built commit, and only once unity-tests (incl. unity-tests-gate) and server-ci passed on that same commit.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_tag != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev/'))
    runs-on: ubuntu-24.04
    environment: dev-builds
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crashverse-android-apk
          path: apk
      - name: Require unity-tests + server-ci green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          need(){ # $1 workflow file: wait (max 90 min) until a run for GITHUB_SHA has completed; require one that succeeded
            for i in $(seq 1 90); do
              runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$1/runs?head_sha=$GITHUB_SHA&per_page=50" -q '[.workflow_runs[]|{s:.status,c:.conclusion}]')
              echo "$runs" | grep -q '"c":"success"' && { echo "$1: success on $GITHUB_SHA"; return 0; }
              echo "$runs" | grep -qE '"s":"(queued|in_progress|waiting|pending|requested)"' || { echo "::error::$1 has no successful run on $GITHUB_SHA ($runs)"; return 1; }
              sleep 60
            done; echo "::error::$1 still running on $GITHUB_SHA after 90 min"; return 1; }
          need unity-tests.yml   # its unity-tests-gate job fails the run when EditMode/PlayMode fail or run 0 tests
          need server-ci.yml
      - name: Create a NEW prerelease at the built commit (pending QA review)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_IN: ${{ github.event.inputs.publish_tag }}
        run: |
          set -e
          TAG="$TAG_IN"
          if [ "$TAG" = next ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" --paginate -q '.[].name' | sed -n 's/^dev-build-\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)
            TAG="dev-build-$(( ${n:-0} + 1 ))"
          fi
          [[ "$TAG" =~ ^dev-build-[0-9]+$ ]] || { echo "::error::tag '$TAG' must be dev-build-N"; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1 || gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG already exists: published builds are never overwritten (QA C-9b); dispatch with the next tag or 'next'"; exit 1
          fi
          gh release create "$TAG" apk/*.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "$TAG (pending QA review)" \
            --notes "Built from $GITHUB_SHA (${GITHUB_REF_NAME}), run $GITHUB_RUN_ID. Signed with the persistent dev key (cert pinned in Tools/ci/dev_cert_sha256.txt), versionCode $GITHUB_RUN_NUMBER. Passed apksigner + built-APK asserts + emulator smoke (API 34/36); unity-tests + server-ci green on this commit. Pending QA review."
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q .object.sha)
          [ "$sha" = "$GITHUB_SHA" ] || { echo "::error::$TAG points at $sha, not the built commit $GITHUB_SHA"; exit 1; }
          echo "published $TAG at $GITHUB_SHA"
