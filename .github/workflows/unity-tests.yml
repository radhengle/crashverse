# THROWAWAY (physics/perf-l10-ci): PlayMode L10 perf verification. Not for merge.
# Unity compile + EditMode tests on every PR to main (CI is the only Unity compile we have).
# Actions pinned by SHA (Security B7). Unity secrets are only available to same-repo branches.
name: Unity EditMode tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: Unity compile + EditMode tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - name: Free disk space (unityci editor image is large)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
          persist-credentials: false

      - name: Release guards + logic tests (fast fail)
        run: |
          python3 Tools/ci/check_release_guards.py
          dotnet build Tools/CompileCheck
          dotnet build Tools/CompileCheck -p:CrashverseDev=true
          dotnet run --project Tools/Tests

      - name: Cache Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Library
          key: Library-PlayMode-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-PlayMode-

      - name: EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1 (docker-based; v4.3.2 needs an unauthenticated CLI download that 403s)
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.50f1
          testMode: playmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: PlayMode L10 perf results

      - name: PERFL10 lines
        if: always()
        run: grep -rhoE 'PERFL10_[A-Z]+,[^<"]*' test-results || echo "no PERFL10 lines"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playmode-l10-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
